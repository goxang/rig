<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rig inbox</title>
<style>
:root { --bg:#fff; --fg:#1d1d1f; --dim:#6e6e73; --line:#e3e3e8; --ok:#1a7f37; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#e8e8ed; --dim:#9a9aa3; --line:#2c2c33; --ok:#4ac26b; --bad:#ff6b6b; } }
body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; margin:0 auto; max-width:960px; padding:16px; }
h1 { font-size:20px; } .dim { color:var(--dim); } input,select,button { font:inherit; padding:6px 10px; margin:2px; }
table { border-collapse:collapse; width:100%; } td,th { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:top; }
pre { white-space:pre-wrap; margin:0; font-size:13px; } .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<h1>rig inbox <span id="who" class="dim"></span></h1>
<form id="login" hidden>
  <input name="user" placeholder="user" autocomplete="username" required>
  <input name="password" type="password" placeholder="password" autocomplete="current-password" required>
  <input name="code" placeholder="TOTP code" autocomplete="one-time-code" size="8">
  <button>Sign in</button>
</form>
<div id="main" hidden>
  <select id="env"></select> <button id="refresh">Refresh</button> <button id="out">Sign out</button>
  <p id="msg"></p>
  <table><thead><tr><th>ID</th><th>Who</th><th>Action</th><th>Why / plan</th><th></th></tr></thead><tbody id="items"></tbody></table>
</div>
<script>
const $ = s => document.querySelector(s);
let token = sessionStorage.getItem('rig-token') || '';
async function call(path, body, env) {
  const r = await fetch(path, {method: body === undefined ? 'GET' : 'POST', headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'X-Rig-Env': env || ''}, body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((j.error && j.error.message) || r.statusText); e.status = r.status; e.hint = j.error && j.error.data && j.error.data.hint; throw e; }
  return j;
}
function text(s) { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; }
async function show() {
  try {
    const me = await call('/v1/engine/session', {}, $('#env').value);
    $('#who').textContent = me.kind + ':' + me.name;
    const items = (await call('/v1/engine/inbox', {}, $('#env').value) || []).filter(i => i.status === 'pending');
    $('#items').innerHTML = items.map(i => `<tr><td>${text(i.id)}</td><td>${text(i.subject.kind + ':' + i.subject.name)}</td><td>${text(i.action)}<pre class="dim">${text(JSON.stringify(i.args || {}))}</pre></td><td>${text(i.why || '')}<pre>${text((i.plan && i.plan.message) || '')}</pre></td><td><button data-id="${text(i.id)}" data-ok="1">Approve</button><button data-id="${text(i.id)}">Reject</button></td></tr>`).join('') || '<tr><td colspan="5" class="dim">nothing waits for approval</td></tr>';
    $('#login').hidden = true; $('#main').hidden = false;
  } catch (e) {
    if (e.status === 401) { token = ''; sessionStorage.removeItem('rig-token'); $('#login').hidden = false; $('#main').hidden = true; } else $('#msg').innerHTML = `<span class="bad">${text(e.message)}</span>`;
  }
}
async function decide(id, approve) {
  for (;;) {
    try {
      const r = await call('/v1/engine/decide', {id, approve}, $('#env').value);
      $('#msg').innerHTML = `<span class="ok">${text(id + (approve ? ' approved' : ' rejected') + (r && r.message ? ': ' + r.message : ''))}</span>`;
      return show();
    } catch (e) {
      if (e.hint !== 'reauth') { $('#msg').innerHTML = `<span class="bad">${text(e.message)}</span>`; return; }
      const secret = prompt(e.message + '\n\nPassword or TOTP code:');
      if (!secret) return;
      try { await call('/v1/reauth', /^\d{6}$/.test(secret) ? {code: secret} : {password: secret}); } catch (e2) { $('#msg').innerHTML = `<span class="bad">${text(e2.message)}</span>`; return; }
    }
  }
}
$('#login').onsubmit = async ev => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try { token = (await call('/v1/login', Object.fromEntries(f))).token; sessionStorage.setItem('rig-token', token); init(); }
  catch (e) { alert(e.message); }
};
$('#items').onclick = ev => { const b = ev.target.closest('button'); if (b) decide(b.dataset.id, !!b.dataset.ok); };
$('#refresh').onclick = show; $('#env').onchange = show;
$('#out').onclick = async () => { try { await call('/v1/logout', {}); } catch {} token = ''; sessionStorage.removeItem('rig-token'); show(); };
async function init() {
  const info = await (await fetch('/v1/info')).json();
  document.title = 'rig inbox · ' + info.project;
  $('#env').innerHTML = (info.envs || []).map(e => `<option ${e === info.env ? 'selected' : ''}>${text(e)}</option>`).join('');
  show();
}
init();
</script>
</body>
</html>
