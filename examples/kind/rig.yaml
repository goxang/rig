# rig on Kubernetes: an api and a worker (one Go binary, ./app) deployed on a local kind cluster
# from the manifests in deploy/, with an HPA on the api. The same services also run on docker, or as
# local processes.
#
#   rig do runtime create      # kind: cluster + registry
#   rig up --build             # everything, in dependency order
#   rig                        # the control plane
version: 1
project: rig-demo
default: kind

services:
  api:
    groups: [app]
    depends_on: [worker]
    image: app
    build: { go: ./app }
    ports: { http: 8080, metrics: 9090 }
    health: { port: http, path: /healthz }
    pprof: { port: metrics }
    env: { ROLE: api, WORKER_URL: "http://worker:8080" }

  worker:
    groups: [app]
    image: app
    build: { go: ./app }
    ports: { http: 8080, metrics: 9090 }
    health: { port: http, path: /healthz }
    pprof: { port: metrics }
    env: { ROLE: worker }

environments:
  kind:
    description: local kind cluster with its own registry
    runtime:
      type: kind
      cluster: rig-demo
      node_image: kindest/node:v1.28.0
      namespace: demo
      registry_port: 5002
      create_namespace: true
      manifests: [deploy]
      env: { PPROF_ENABLED: "true" }

  docker:
    description: containers on one docker network
    runtime: { type: docker, env: { PPROF_ENABLED: "true" } }

  local:
    description: api and worker as local processes
    runtime: { type: local, env: { PPROF_ENABLED: "true" } }
    services:
      api:    { env: { WORKER_URL: "http://127.0.0.1:8081" } }
      worker: { ports: { http: 8081, metrics: 9091 }, env: { PORT: "8081", METRICS_PORT: "9091" } }

components:
  # load sent from inside rig, in every environment
  load: { kind: loadgen, type: http, target: "svc://api:8080/echo?q=rig", rate: 20, max: 400, step: 20 }
  api-http: { kind: query, type: http, addr: "svc://api:8080" }
  go-build: { type: go, base: "docker://alpine:3.20" }

queries:
  echo: { source: api-http, query: "GET /echo?q=hello", help: "one request through api and worker" }

ai:
  ideas:
    load: ["raise load until the api HPA scales out, then report the rate"]
