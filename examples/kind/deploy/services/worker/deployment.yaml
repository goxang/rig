apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: rig-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: rig-demo }
    spec:
      containers:
        - name: worker
          image: $REGISTRY/app:$TAG
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: worker }
            - { name: ZIPKIN_URL, value: "http://zipkin:9411" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector: { app.kubernetes.io/name: worker }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
