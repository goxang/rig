name: {%.Name%}
version: 0.1.0
description: what {%.Name%} shows and does
build: [sh, -c, "npm install --silent && npx tsc && chmod +x dist/plugin.js"]
server: {command: [./dist/plugin.js]}
skills: [skills/{%.Name%}]
views:
  {%.Title%}:
    slot: tab
    widget: table
    source: {%.Name%}.items
    refresh: 30s
    actions: [{key: H, name: hello, action: {%.Name%}.hello, args: {name: '${row.name}'}}]
