name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
{%- if eq .Lang "go"%}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
{%- end%}
{%- if eq .Lang "ts"%}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
{%- end%}
      - name: archives
        run: |
          v=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: $v/" rig-plugin.yaml
          mkdir -p out
{%- if eq .Lang "go"%}
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -mod=mod -o bin/{%.Name%} .
            tar czf out/{%.Name%}_${v}_${p/\//_}.tar.gz --exclude=out --exclude=.git .
          done
{%- else%}
{%- if eq .Lang "ts"%}
          npm install && npx tsc && chmod +x dist/plugin.js
{%- end%}
          tar czf out/{%.Name%}_${v}_any.tar.gz --exclude=out --exclude=.git --exclude=node_modules .
{%- end%}
          cd out && sha256sum *.tar.gz | tee SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes
      # ponytail: the index entry is proposed by hand; sign with minisign once the registry asks for it
      - name: index entry
        run: |
          echo '### index entry for goxang/rig-plugins registry/index.json' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
